<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 浏览器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --border:#e3e6ec; --text:#20242e; --muted:#717a8c;
  --accent:#2f6fed; --accent-soft:#eef3ff; --code-bg:#f1f3f6; --hover:#f0f2f6;
  --mark:#ffe58a; --danger:#d64545; --shadow:0 1px 3px rgba(20,28,48,.08);
  --doc-maxw:920px;   /* 正文栏宽度上限：拖左右栏缘的手柄可改，JS 只覆写这一个变量 */
}
[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a22; --border:#262d3a; --text:#e7eaf0; --muted:#8d96a8;
  --accent:#5b9bff; --accent-soft:#182440; --code-bg:#0c0f14; --hover:#1e2431;
  --mark:#6b5200;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
button.small{padding:3px 8px;font-size:12px}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10}
.brand{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.brand .logo{font-size:20px}
#headerStatus{color:var(--muted);font-size:12.5px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
#progress{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
#progressBar{flex:1;height:6px;background:var(--code-bg);border-radius:3px;overflow:hidden}
#progressBar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#progressText{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:330px;min-width:220px;max-width:540px;resize:horizontal;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);transition:width .22s ease,min-width .22s ease,border-right-width .22s ease}
/* 侧栏折叠（缩进 / 拉出）：宽度收到 0，原生拖拽手柄一并停用；折叠态统一记在 body.side-collapsed 上 */
body.side-collapsed #sidebar{width:0 !important;min-width:0 !important;max-width:none;border-right-width:0;resize:none}
/* 栏目边缘的开合按钮：0 宽的分缝容器 + 绝对定位的圆钮（22px，约鼠标指针大小，浅蓝底 --accent-soft），
   圆钮正好骑在栏目右缘上；栏目收起时它跟着分缝滑到窗口左缘（left 同步过渡，不会跳变）。
   箭头语义：张开 → 向左箭头（可缩进）；缩进 → 向右箭头（可拉出）。 */
#sideRail{flex:0 0 0;width:0;position:relative;overflow:visible;z-index:15}
#btnSidebar{position:absolute;left:-11px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--accent-soft);color:var(--muted);font-size:14px;line-height:1;cursor:pointer;box-shadow:var(--shadow);transition:left .22s ease,color .15s,border-color .15s}
body.side-collapsed #btnSidebar{left:0}
#btnSidebar:hover:not(:disabled){color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#btnSidebar:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){#sidebar,#btnSidebar{transition:none}}
.side-top{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.search-row{display:flex;gap:8px;align-items:center}
#searchInput{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;font:inherit}
#searchInput:focus{border-color:var(--accent)}
.search-row label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;white-space:nowrap;cursor:pointer}
#restoreBanner{margin:10px;padding:10px 12px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.rb-title{font-weight:600}
.rb-meta{color:var(--muted);font-size:12px}
.rb-btns{display:flex;gap:8px}
#fileList{flex:1;overflow:auto;padding:8px}
.empty{color:var(--muted);text-align:center;padding:32px 12px;font-size:13px;line-height:2}
details{margin-left:2px}
summary{cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--muted);font-size:13px;user-select:none;list-style:none;display:flex;align-items:center;gap:4px}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';display:inline-block;transition:transform .15s;font-size:10px;color:var(--muted)}
details[open]>summary::before{transform:rotate(90deg)}
summary:hover{background:var(--hover);color:var(--text)}
.file-row{display:flex;align-items:center;gap:7px;padding:5px 8px 5px 14px;border-radius:6px;cursor:pointer;user-select:none;border-left:2px solid transparent}
.file-row:hover{background:var(--hover)}
.file-row.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.fr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-size{color:var(--muted);font-size:11px}
.sr-row{padding:7px 10px;border-radius:8px;cursor:pointer;border-bottom:1px dashed var(--border)}
.sr-row:hover{background:var(--hover)}
.sr-head{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-snip{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sideStatus{padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
#content{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg)}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
#filePath{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
#navPos{color:var(--muted);font-size:12px;min-width:64px;text-align:center}
#article{flex:1;overflow:auto;position:relative}
#doc{max-width:var(--doc-maxw);margin:0 auto;padding:26px 40px 90px}
/* 正文栏宽度手柄（左右各一条，骑在栏缘上）：一条 34px 的隐形带，鼠标移到栏缘附近才显形——
   居中的 4×44 圆条（--border 常色，悬停/聚焦/拖动转 --accent 并加粗）+ 1px 竖线（拖动把手），
   光标始终是 col-resize 作提示。位置（left / right）由 syncDocGrips() 计算并自带避让：
   左边绝不越进侧栏（连开合圆钮一起让开），右边不压住纵向滚动条。
   欢迎页 / 目录面板打开 / 窄屏 / 触屏四种情况下整条隐藏（见下方选择器与 media 查询）。 */
.docGrip{position:absolute;top:0;bottom:0;width:34px;cursor:col-resize;touch-action:none;z-index:12}
.docGrip::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:44px;border-radius:3px;background:var(--border);opacity:0;transition:opacity .15s,background-color .15s,width .15s}
.docGrip::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--accent);opacity:0;transition:opacity .15s}
.docGrip:hover::before,.docGrip:focus-visible::before,.docGrip.dragging::before{opacity:1;background:var(--accent);width:5px}
.docGrip:hover::after,.docGrip:focus-visible::after,.docGrip.dragging::after{opacity:.4}
.docGrip:focus-visible{outline:none}
#welcome:not([hidden]) ~ .docGrip,
#tocPanel:not([hidden]) ~ .docGrip{display:none}
body.doc-resizing{user-select:none;-webkit-user-select:none;cursor:col-resize}
#doc h1{font-size:1.9em;border-bottom:1px solid var(--border);padding-bottom:.3em;margin:1.2em 0 .6em}
#doc h2{font-size:1.45em;border-bottom:1px solid var(--border);padding-bottom:.25em;margin:1.2em 0 .5em}
#doc h3{font-size:1.2em;margin:1.1em 0 .4em}
#doc h4{font-size:1.05em;margin:1em 0 .3em}
#doc h1:first-child{margin-top:0}
#doc p{margin:.6em 0}
#doc a{color:var(--accent);text-decoration:none}
#doc a:hover{text-decoration:underline}
#doc img{max-width:100%;border-radius:8px}
#doc code{font-family:Consolas,"JetBrains Mono","Courier New",monospace;font-size:.9em}
#doc :not(pre)>code{background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
#doc pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;line-height:1.55}
#doc pre code{background:none;border:none;padding:0}
#doc .codeblock{position:relative;margin:1em 0}
#doc .codeblock>pre{margin:0}
#doc .codeblock .codecopy{position:absolute;top:8px;right:8px;z-index:2;padding:2px 10px;font-size:12px;line-height:1.7;border-radius:7px;background:var(--panel);color:var(--muted);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s,color .15s,border-color .15s,background-color .15s}
#doc .codeblock:hover .codecopy,
#doc .codeblock:focus-within .codecopy{opacity:1;pointer-events:auto}
#doc .codeblock .codecopy:hover{color:var(--accent);border-color:var(--accent)}
#doc .codeblock .codecopy.copied{color:#fff;background:var(--accent);border-color:var(--accent)}
@media (hover:none){
  #doc .codeblock .codecopy{opacity:1;pointer-events:auto}
  /* 触屏没有鼠标可拖：手柄收掉，正文栏直接铺满 */
  #doc{max-width:none}
  .docGrip{display:none}
}
#doc blockquote{margin:.8em 0;padding:4px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--muted);border-radius:0 8px 8px 0}
#doc table{border-collapse:collapse;margin:.9em 0;display:block;overflow-x:auto;max-width:100%}
#doc th,#doc td{border:1px solid var(--border);padding:6px 14px;text-align:left}
#doc th{background:var(--code-bg);font-weight:600}
#doc tr:nth-child(2n) td{background:color-mix(in srgb,var(--panel) 55%,transparent)}
#doc hr{border:none;border-top:2px solid var(--border);margin:1.6em 0}
#doc ul,#doc ol{padding-left:1.8em;margin:.5em 0}
#doc li{margin:.2em 0}
#doc li.task-list-item{list-style:none;margin-left:-1.4em}
#doc li.task-list-item input{margin-right:8px;accent-color:var(--accent);cursor:pointer}
mark{background:var(--mark);padding:0 3px;border-radius:3px}
#doc .err{color:var(--danger);padding:20px;text-align:center}
#doc .rawview{white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace;font-size:13px}
#tocPanel{position:absolute;top:0;right:0;bottom:0;width:280px;background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:14px 10px 30px;z-index:20;box-shadow:var(--shadow)}
#tocPanel h6{margin:0 6px 8px;color:var(--muted);font-size:12px;letter-spacing:1px}
#tocPanel ul{list-style:none;margin:0;padding:0}
#tocPanel li{margin:1px 0}
#tocPanel a{display:block;padding:4px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tocPanel a:hover{background:var(--hover);color:var(--accent)}
#tocPanel .toc-l1{font-weight:700}
#tocPanel .toc-l2{padding-left:10px}
#tocPanel .toc-l3{padding-left:20px;font-size:12.5px}
#tocPanel .toc-l4{padding-left:30px;font-size:12px;color:var(--muted)}
#welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.w-card{text-align:center;padding:60px 70px;border:2px dashed var(--border);border-radius:20px;background:var(--panel);color:var(--muted);max-width:520px}
.w-card .big{font-size:56px;margin-bottom:16px}
.w-card h2{margin:0 0 8px;color:var(--text)}
.w-card p{margin:6px 0;font-size:13.5px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(24px);background:#1b2230;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:70vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none !important}
@media (max-width:760px){
  #sidebar{width:240px}
  /* 窄屏也拿不到手柄（下面的 .docGrip 隐藏），正文栏索性铺满，免得卡在一个调不了的窄栏上 */
  #doc{padding:18px 18px 70px;max-width:none}
  .docGrip{display:none}
  #tocPanel{width:220px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">📖</span><span data-i18n="appName">Markdown 浏览器</span></div>
  <span id="headerStatus"></span>
  <div class="spacer"></div>
  <button id="btnDir" class="primary" data-i18n="btnDir">📁 打开文件夹</button>
  <button id="btnFiles" data-i18n="btnFiles">📄 打开文件</button>
  <button id="btnClear" data-i18n="btnClear">🗑 清空</button>
  <button id="btnTheme" title="切换主题" data-i18n-title="btnThemeTitle">🌙</button>
  <button id="btnLang" title="切换语言" data-i18n-title="btnLangTitle">🌐 EN</button>
  <div id="progress" hidden>
    <div id="progressBar"><i></i></div>
    <span id="progressText"></span>
    <button id="btnCancelRead" class="small" data-i18n="btnCancelRead">取消</button>
  </div>
</header>
<main>
  <aside id="sidebar">
    <div class="side-top">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="搜索文件名…" autocomplete="off" data-i18n-placeholder="searchPh">
        <label title="在已加载的文件内容中搜索" data-i18n-title="searchContentTitle"><input type="checkbox" id="searchContent"><span data-i18n="searchContent">全文</span></label>
      </div>
    </div>
    <div id="restoreBanner" hidden></div>
    <div id="fileList"></div>
    <div id="sideStatus"></div>
  </aside>
  <div id="sideRail">
    <button id="btnSidebar" title="收起侧栏（Ctrl+B）" data-i18n-title="sideHideTitle" aria-controls="sidebar" aria-expanded="true" aria-label="收起侧栏（Ctrl+B）">‹</button>
  </div>
  <section id="content">
    <div id="toolbar" hidden>
      <span id="filePath"></span>
      <button id="btnPrev" title="上一个（←）" data-i18n-title="btnPrevTitle">←</button>
      <span id="navPos"></span>
      <button id="btnNext" title="下一个（→）" data-i18n-title="btnNextTitle">→</button>
      <button id="btnToc" title="显示 / 隐藏目录" data-i18n="btnToc" data-i18n-title="btnTocTitle">📑 目录</button>
      <button id="btnCopy" title="复制 Markdown 原文" data-i18n="btnCopy" data-i18n-title="btnCopyTitle">📋 复制</button>
      <button id="btnRaw" title="查看 / 返回渲染视图" data-i18n="btnRaw" data-i18n-title="btnRawTitle">源文本</button>
    </div>
    <div id="article"><div id="doc"></div></div>
    <div id="tocPanel" hidden><h6>目录</h6></div>
    <div id="welcome">
      <div class="w-card">
        <div class="big">📂</div>
        <h2 data-i18n="welcomeTitle">打开一个本地文件夹</h2>
        <p data-i18n="welcomeP1">点击上方「打开文件夹」选择目录，或直接把文件夹 / Markdown 文件拖到本页。</p>
        <p data-i18n="welcomeP2">支持 .md / .markdown / .mdown / .mkd / .mdx，纯本地运行，无需服务器与网络。</p>
      </div>
    </div>
    <div id="docGripL" class="docGrip" data-dir="-1" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整内容宽度（双击复位）" data-i18n-title="docGripTitle" aria-label="拖动调整内容宽度（双击复位）" data-i18n-aria-label="docGripTitle"></div>
    <div id="docGripR" class="docGrip" data-dir="1" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整内容宽度（双击复位）" data-i18n-title="docGripTitle" aria-label="拖动调整内容宽度（双击复位）" data-i18n-aria-label="docGripTitle"></div>
  </section>
</main>
<div id="toast"></div>
<input type="file" id="dirInput" webkitdirectory multiple hidden>
<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mdx" multiple hidden>
<script>
